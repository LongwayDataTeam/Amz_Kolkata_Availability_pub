
name: Amz_Kolkata_Availability_Scrapper

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours (UTC)

  workflow_dispatch:       # Manual trigger

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # 1. Setup SSH to access private repository
      # ==================================================
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H github.com >> ~/.ssh/known_hosts

      # ==================================================
      # 2. Clone private scraper repository
      # ==================================================
      - name: Clone private repo
        run: |
          git clone git@github.com:LongwayDataTeam/Amz_kolkata_Availability_pvt.git

      # ==================================================
      # 3. Setup Python
      # ==================================================
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      # ==================================================
      # 4. Install Python dependencies
      # ==================================================
      - name: Install dependencies
        working-directory: Amz_kolkata_Availability_pvt
        run: |
          python -m pip install --upgrade pip

          pip install \
            gspread \
            oauth2client \
            pandas \
            openpyxl \
            selenium \
            webdriver-manager \
            beautifulsoup4 \
            pytz \
            python-dotenv

      # ==================================================
      # 5. Install Google Chrome and dependencies
      # ==================================================
      - name: Install Google Chrome
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            unzip \
            xvfb \
            libnss3 \
            libxss1 \
            libxi6 \
            fonts-liberation

          wget -q \
            https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb

          sudo apt-get install -y \
            ./google-chrome-stable_current_amd64.deb

          echo "========================================"
          echo "Chrome Installed Version:"
          google-chrome --version
          echo "========================================"

      # ==================================================
      # 6. Run private scraper
      # ==================================================
      - name: Run scraper
        working-directory: Amz_kolkata_Availability_pvt
        env:
          INPUT_SPREADSHEET_ID: ${{ secrets.INPUT_SPREADSHEET_ID }}
          OUTPUT_SPREADSHEET_ID: ${{ secrets.OUTPUT_SPREADSHEET_ID }}
          INPUT_SHEET_NAME: ${{ secrets.INPUT_SHEET_NAME }}
          OUTPUT_SHEET_NAME: ${{ secrets.OUTPUT_SHEET_NAME }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.SERVICE_ACCOUNT_JSON }}
        run: |
          python amz_kolkata_availability_pvt.py

      # ==================================================
      # 7. Upload Excel results and all screenshots
      # ==================================================
      - name: Upload scraper results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amazon-kolkata-scraper-results-${{ github.run_number }}
          path: |
            Amz_kolkata_Availability_pvt/Amazon_Results.xlsx
            Amz_kolkata_Availability_pvt/screenshots/**/*.png
          if-no-files-found: warn
          retention-days: 7
